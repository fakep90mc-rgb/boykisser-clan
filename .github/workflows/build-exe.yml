name: Build prank exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --name prank --icon prank.ico prank.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prank-exe
          path: dist/prank.exe